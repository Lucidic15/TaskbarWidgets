name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/AudioFlipper/AudioFlipper.csproj -c Release

      - name: Upload AudioFlipper.exe
        uses: actions/upload-artifact@v4
        with:
          name: AudioFlipper
          path: src/AudioFlipper/bin/Release/net48/AudioFlipper.exe
