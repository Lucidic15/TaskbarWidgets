name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src/RDPLauncher/RDPLauncher.csproj -c Release

      - name: Upload RDPLauncher.exe
        uses: actions/upload-artifact@v4
        with:
          name: RDPLauncher
          path: src/RDPLauncher/bin/Release/net48/RDPLauncher.exe
